name: Model validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned development tools
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("uv.lock").read_text())
          lines = []
          for package in lock["package"]:
              if "registry" not in package.get("source", {}):
                  continue
              artifacts = package.get("wheels", []) + [package["sdist"]]
              hashes = " ".join("--hash=" + item["hash"] for item in artifacts)
              lines.append(f'{package["name"]}=={package["version"]} {hashes}')
          requirements = Path("/tmp/mock-lbo-requirements.txt")
          requirements.write_text("\n".join(lines) + "\n")
          subprocess.run([sys.executable, "-m", "pip", "install", "--require-hashes", "-r", str(requirements)], check=True)
          PY
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy
      - name: Unit and workbook audit tests
        run: pytest -q
      - name: Independent scenario checks
        env:
          PYTHONPATH: src
        run: |
          python -m mock_lbo.cli validate --case base
          python -m mock_lbo.cli validate --case downside
          python -m mock_lbo.cli validate --case upside
          python -m mock_lbo.cli audit
