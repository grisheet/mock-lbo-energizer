name: Model validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned development tools
        run: python -m pip install pytest==8.3.5 ruff==0.11.13 mypy==1.15.0
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy
      - name: Unit and workbook audit tests
        run: pytest -q
      - name: Independent scenario checks
        env:
          PYTHONPATH: src
        run: |
          python -m mock_lbo.cli validate --case base
          python -m mock_lbo.cli validate --case downside
          python -m mock_lbo.cli validate --case upside
          python -m mock_lbo.cli audit
