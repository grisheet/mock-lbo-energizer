[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mock-lbo-energizer"
version = "1.0.0"
description = "Point-in-time educational LBO with linked Excel and independent Python validation"
requires-python = ">=3.12,<3.13"
dependencies = []
license = "MIT"

[project.scripts]
mock-lbo = "mock_lbo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_lbo"]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13", "mypy==1.15.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
files = ["src/mock_lbo"]
